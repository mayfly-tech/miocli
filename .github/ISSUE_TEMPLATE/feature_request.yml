name: Feature request / 功能请求
description: Suggest an improvement to miocli. / 提出 miocli 的改进建议。
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first and read the [contributing guide](https://github.com/mayfly-tech/miocli/blob/main/CONTRIBUTING.md). Discuss larger behavior changes in an issue first.
        请先搜索已有 Issue，并阅读[贡献指南](https://github.com/mayfly-tech/miocli/blob/main/CONTRIBUTING.zh-CN.md)。较大的行为变更请先在 Issue 中讨论。

        Report vulnerabilities privately through GitHub Security Advisories. Do not include secrets, subscription URLs, private configuration (including storage settings) or real traffic data.
        安全漏洞请通过 GitHub Security Advisories 私下报告。不要提交密钥、订阅地址、私有配置（包括存储配置）或真实流量数据。
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: Describe the use case, current limitation and affected users. / 描述使用场景、当前限制和受影响的用户。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / 建议方案
      description: Describe the desired behavior or interaction. / 描述期望的行为或交互。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 替代方案
      description: Optional; describe other solutions considered or current workarounds. / 可选；描述考虑过的其他方案或当前绕行方法。
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充背景
      description: Optional; redact examples, screenshots and links. / 可选；示例、截图和链接均须脱敏。
  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checklist / 提交确认
      options:
        - label: I searched existing issues and found no duplicate request. / 我已搜索已有 Issue，未找到相同请求。
          required: true
        - label: I checked the submission and removed sensitive information. / 我已检查提交内容并删除敏感信息。
          required: true
