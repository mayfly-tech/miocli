name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  preflight:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
    permissions:
      contents: read

  build:
    needs: [release-please, preflight]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            extension: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            extension: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            extension: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            extension: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Install license export tool
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
          ARCHIVE: ${{ matrix.archive }}
          COMMIT: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag must be a semantic version: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          name="miocli_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X miocli/internal/cli.version=${version} -X miocli/internal/cli.commit=${COMMIT} -X miocli/internal/cli.buildDate=${build_date}" \
            -o "dist/${name}/miocli${EXTENSION}" ./cmd/miocli
          "$(go env GOPATH)/bin/go-licenses" save ./cmd/miocli --save_path="dist/${name}/THIRD_PARTY_LICENSES"
          cp README.md README.zh-CN.md \
            CONTRIBUTING.md CONTRIBUTING.zh-CN.md SECURITY.md SECURITY.zh-CN.md \
            CHANGELOG.md LICENSE "dist/${name}/"
          cp -R docs "dist/${name}/docs"
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && zip -q -r "${name}.zip" "$name" && sha256sum "${name}.zip" > "${name}.zip.sha256")
          else
            (cd dist && tar -czf "${name}.tar.gz" "$name" && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  installers:
    needs: [release-please, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - name: Configure installer repository
        run: |
          mkdir -p dist
          sed "s|__MIOCLI_REPOSITORY__|${GITHUB_REPOSITORY}|g" install.sh > dist/install.sh
          sed "s|__MIOCLI_REPOSITORY__|${GITHUB_REPOSITORY}|g" install.ps1 > dist/install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-installers
          path: dist/install.*
          if-no-files-found: error

  upload:
    needs: [release-please, build, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        working-directory: release-assets
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag must be a semantic version: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          files=(install.sh install.ps1)
          for os in linux darwin windows; do
            extension=tar.gz
            if [ "$os" = windows ]; then extension=zip; fi
            for arch in amd64 arm64; do
              archive="miocli_${RELEASE_TAG#v}_${os}_${arch}.${extension}"
              files+=("$archive" "$archive.sha256")
            done
          done
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty release asset: $file"
              exit 1
            fi
          done
          sha256sum --check --strict ./*.sha256
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
