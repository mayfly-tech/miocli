name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            extension: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            extension: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            extension: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            extension: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Install license export tool
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
          ARCHIVE: ${{ matrix.archive }}
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag must be a semantic version: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          version="${REF_NAME#v}"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          name="miocli_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X miocli/internal/cli.version=${version} -X miocli/internal/cli.commit=${COMMIT} -X miocli/internal/cli.buildDate=${build_date}" \
            -o "dist/${name}/miocli${EXTENSION}" ./cmd/miocli
          "$(go env GOPATH)/bin/go-licenses" save ./cmd/miocli --save_path="dist/${name}/THIRD_PARTY_LICENSES"
          cp README.md README_EN.md LICENSE "dist/${name}/"
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && zip -q -r "${name}.zip" "$name" && sha256sum "${name}.zip" > "${name}.zip.sha256")
          else
            (cd dist && tar -czf "${name}.tar.gz" "$name" && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.*
          if-no-files-found: error

  installers:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure installer repository
        run: |
          mkdir -p dist
          sed "s|__MIOCLI_REPOSITORY__|${GITHUB_REPOSITORY}|g" install.sh > dist/install.sh
          sed "s|__MIOCLI_REPOSITORY__|${GITHUB_REPOSITORY}|g" install.ps1 > dist/install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-installers
          path: dist/install.*
          if-no-files-found: error

  draft:
    needs: [build, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*

  cos:
    needs: draft
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    runs-on: ubuntu-latest
    environment: s3-release
    concurrency:
      group: s3-stable-publication
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare COS files
        id: cos
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_KEY_PREFIX: ${{ secrets.S3_KEY_PREFIX }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "A stable semantic version tag is required"
            exit 1
          fi
          if [[ -z "$S3_BUCKET" || -z "$S3_REGION" || -z "$S3_ACCESS_KEY_ID" || -z "$S3_SECRET_ACCESS_KEY" ]]; then
            echo "S3_BUCKET, S3_REGION, S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY Secrets are required"
            exit 1
          fi
          prefix="${S3_KEY_PREFIX%/}"
          if [[ -n "$prefix" && ! "$prefix" =~ ^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$ ]]; then
            echo "Invalid S3_KEY_PREFIX"
            exit 1
          fi
          printf 'remote_path=%s\n' "${prefix:-.}" >> "$GITHUB_OUTPUT"
          (cd release-assets && sha256sum --check --strict *.sha256)
          mkdir -p "cos-files/miocli/releases/$RELEASE_TAG" cos-stable/miocli
          cp release-assets/* "cos-files/miocli/releases/$RELEASE_TAG/"
          cp release-assets/install.sh release-assets/install.ps1 cos-files/miocli/
          printf '%s\n' "$RELEASE_TAG" > cos-stable/miocli/stable.txt
      - name: Upload miocli packages and installers
        uses: TencentCloud/cos-action@5ee3807d5ff6fddadbbb1d3e658c0690863de8ec # v1
        with:
          secret_id: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret_key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          cos_bucket: ${{ secrets.S3_BUCKET }}
          cos_region: ${{ secrets.S3_REGION }}
          local_path: cos-files
          remote_path: ${{ steps.cos.outputs.remote_path }}
          clean: 'false'
      - name: Upload stable index last
        uses: TencentCloud/cos-action@5ee3807d5ff6fddadbbb1d3e658c0690863de8ec # v1
        with:
          secret_id: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret_key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          cos_bucket: ${{ secrets.S3_BUCKET }}
          cos_region: ${{ secrets.S3_REGION }}
          local_path: cos-stable
          remote_path: ${{ steps.cos.outputs.remote_path }}
          clean: 'false'
