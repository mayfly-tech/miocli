name: Publish domestic S3 distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Previously published stable release to synchronize or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: s3-stable-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: s3-release
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "A stable semantic version tag is required"
            exit 1
          fi
          printf 'value=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}
          persist-credentials: false
      - name: Check publisher dependencies
        run: |
          python3 --version
          gh --version
          curl --version
          aws --version
      - name: Verify and publish immutable distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_KEY_PREFIX: ${{ vars.S3_KEY_PREFIX }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: python3 scripts/publish_s3.py
